<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>

    <!-- Accent Gradient for Header -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatLeft {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-18px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatRight {
        0% { transform: translateX(0px); }
        50% { transform: translateX(18px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .circuit-flow {
        stroke-dasharray: 8 6;
        animation: dashMove 2.5s linear infinite;
      }
      .dynamic-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 180px;
      }
      .dynamic-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 3s;
        transform-origin: 1000px 180px;
      }
      .pill-float-left {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .pill-float-right {
        animation: floatRight 7s ease-in-out infinite;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Mesh -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Dynamic Ambience Orbs (Behind) -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" class="dynamic-orb-1" opacity="0.25" />
  <circle cx="1000" cy="180" r="150" fill="#818cf8" filter="url(#glow)" class="dynamic-orb-2" opacity="0.25" />

  <!-- Dynamic Process Workflow Lines (Midground) -->
  <path d="M 80 180 Q 250 80, 420 180 T 780 180 T 1120 180" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="circuit-flow" />
  <path d="M 80 200 Q 280 290, 520 200 T 920 200 T 1120 200" fill="none" stroke="url(#lineGrad)" stroke-width="1.8" class="circuit-flow" opacity="0.6" style="animation-duration: 4s;" />

  <!-- Dynamic Badges / Process Pills Left (Midground) -->
  <g class="pill-float-left">
    <g transform="translate(70, 70)" filter="url(#cardShadow)">
      <rect width="170" height="40" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="20" r="6" fill="#38bdf8" />
      <text x="38" y="25" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="600">⚡ BPMN 2.0 Engine</text>
    </g>
    <g transform="translate(50, 250)" filter="url(#cardShadow)">
      <rect width="185" height="40" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="20" r="6" fill="#818cf8" />
      <text x="38" y="25" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="600">🔄 Visual Workflows</text>
    </g>
  </g>

  <!-- Dynamic Badges / Process Pills Right (Midground) -->
  <g class="pill-float-right">
    <g transform="translate(960, 70)" filter="url(#cardShadow)">
      <rect width="175" height="40" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="24" cy="20" r="6" fill="#c084fc" />
      <text x="38" y="25" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="600">🚀 Enterprise SaaS</text>
    </g>
    <g transform="translate(945, 250)" filter="url(#cardShadow)">
      <rect width="195" height="40" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2" />
      <circle cx="24" cy="20" r="6" fill="#34d399" />
      <text x="38" y="25" fill="#f1f5f9" font-size="13" font-family="sans-serif" font-weight="600">🛡️ Self-Hosted FOSS</text>
    </g>
  </g>

  <!-- Center Decorative Glow Backplate (Ensures Foreground Text Crisp Clarity) -->
  <rect x="250" y="55" width="700" height="250" rx="20" fill="#0b1329" fill-opacity="0.75" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />

  <!-- Center Foreground Title & Subtitle (Unobscured Foreground) -->
  <g id="foreground-text">
    <!-- Category Tag -->
    <rect x="470" y="80" width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="99" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" class="font-title" font-size="44" filter="url(#glow)">Low-Code Digital Process Automation</text>
    <text x="600" y="165" text-anchor="middle" fill="#ffffff" class="font-title" font-size="44">Low-Code Digital Process Automation</text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" fill="#94a3b8" class="font-sub" font-size="18">Enterprise Workflow Orchestration • Visual BPMN Modeling • SaaS &amp; Open-Source</text>

    <!-- Feature Pills inside Foreground Banner -->
    <g transform="translate(370, 240)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="65" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">📊 Pricing Benchmarks</text>

      <rect x="145" y="0" width="145" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="217" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">⭐ Star-Ranked FOSS</text>

      <rect x="305" y="0" width="155" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="382" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">🏢 Market Cap Ranked</text>
    </g>
  </g>
</svg>
